<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Каталог ЖК Москвы и МО | Савушкин Эстейт</title>
    <meta
      name="description"
      content="Каталог новостроек Москвы и МО: фильтры по району, метро, бюджету, комнатам и классу, сортировка и постраничный вывод."
    />
    <link rel="canonical" href="https://shmitrix.ru/catalog.html" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <a class="brand" href="./index.html"><span class="brand-dot"></span>Савушкин Эстейт</a>
        <nav class="menu">
          <a href="./index.html#catalog">Главная</a>
          <a href="./catalog.html">Каталог ЖК</a>
          <a href="./index.html#launch-articles">Статьи</a>
          <a href="./index.html#contact">Контакты</a>
        </nav>
      </div>
    </header>

    <nav class="container breadcrumb-nav" aria-label="Хлебные крошки">
      <a href="./index.html">Главная</a>
      <span>›</span>
      <a href="./catalog.html">Каталог ЖК</a>
    </nav>

    <main>
      <section class="section">
        <div class="container">
          <div class="section-heading">
            <div>
              <h1>Каталог ЖК</h1>
              <p>Фильтруйте проекты по району, метро, бюджету, комнатам и классу.</p>
            </div>
          </div>

          <form class="catalog-filters" id="catalog-filters-form">
            <div class="catalog-filter-grid">
              <label>
                Район
                <select id="filter-district" name="district">
                  <option value="">Любой район</option>
                </select>
              </label>
              <label>
                Метро
                <select id="filter-metro" name="metro">
                  <option value="">Любое метро</option>
                </select>
              </label>
              <label>
                Бюджет
                <select id="filter-budget" name="budget">
                  <option value="">Любой бюджет</option>
                  <option value="0-10000000">до 10 млн ₽</option>
                  <option value="10000000-15000000">10–15 млн ₽</option>
                  <option value="15000000-25000000">15–25 млн ₽</option>
                  <option value="25000000-999999999">от 25 млн ₽</option>
                </select>
              </label>
              <label>
                Комнаты
                <select id="filter-rooms" name="rooms">
                  <option value="">Любое количество</option>
                  <option value="studio">Студия</option>
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4+">4+</option>
                </select>
              </label>
              <label>
                Класс
                <select id="filter-class" name="classType">
                  <option value="">Любой класс</option>
                  <option value="comfort">Комфорт</option>
                  <option value="business">Бизнес</option>
                  <option value="premium">Премиум</option>
                </select>
              </label>
              <label>
                Сортировка
                <select id="filter-sort" name="sort">
                  <option value="priority">Сначала рекомендуемые</option>
                  <option value="price-asc">Цена: по возрастанию</option>
                  <option value="price-desc">Цена: по убыванию</option>
                </select>
              </label>
            </div>
            <div class="catalog-filter-actions">
              <button class="btn btn-small" type="submit">Применить</button>
              <button class="btn btn-small btn-outline" type="button" id="catalog-reset">Сбросить</button>
            </div>
          </form>

          <p class="catalog-summary" id="catalog-summary"></p>
          <div class="cards-grid" id="catalog-results"></div>
          <p class="catalog-more-wrap">
            <button class="btn btn-outline" type="button" id="catalog-show-more">Показать ещё</button>
          </p>
        </div>
      </section>
    </main>

    <script src="./realty-data.js"></script>
    <script src="./catalog.js"></script>
  </body>
</html>
