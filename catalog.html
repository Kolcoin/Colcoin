    <main>
      <section class="section">
        <div class="container">
          <div class="section-heading">
            <div>
              <h1>Каталог</h1>
              <p>Фильтруйте проекты по району, метро, бюджету, комнатам и классу.</p>
            </div>
          </div>

          <div class="catalog-region-segments" id="catalog-region-segments" aria-label="Сегменты по региону">
            <button class="catalog-segment-btn active" type="button" data-region-segment="all" data-label="Все">
              Все
            </button>
            <button class="catalog-segment-btn" type="button" data-region-segment="moscow" data-label="Москва">
              Москва
            </button>
            <button class="catalog-segment-btn" type="button" data-region-segment="mo" data-label="МО">
              МО
            </button>
            <button class="catalog-segment-btn" type="button" data-region-segment="other" data-label="Остальные регионы">
              Остальные регионы
            </button>
          </div>

          <div class="catalog-quick-filters" id="catalog-quick-filters" aria-label="Быстрые фильтры каталога">
            <button class="catalog-quick-btn is-active" type="button" data-quick-filter="">
              Все объекты
            </button>
            <button class="catalog-quick-btn" type="button" data-quick-filter="budget-low">
              до 10 млн
            </button>
            <button class="catalog-quick-btn" type="button" data-quick-filter="ready">
              Сданные
            </button>
            <button class="catalog-quick-btn" type="button" data-quick-filter="metro">
              Есть метро
            </button>
            <button class="catalog-quick-btn" type="button" data-quick-filter="business-plus">
              Бизнес и выше
            </button>
          </div>

          <form class="catalog-filters" id="catalog-filters-form">
            <div class="catalog-filters-form">
              <label>
                Район
                <select id="filter-district" name="district">
                  <option value="">Любой район</option>
                </select>
              </label>
              <label>
                Метро
                <select id="filter-metro" name="metro">
                  <option value="">Любое метро</option>
                </select>
              </label>
              <label>
                Бюджет
                <select id="filter-budget" name="budget">
                  <option value="">Любой бюджет</option>
                  <option value="0-10000000">до 10 млн ₽</option>
                  <option value="10000000-15000000">10–15 млн ₽</option>
                  <option value="15000000-25000000">15–25 млн ₽</option>
                  <option value="25000000-999999999">от 25 млн ₽</option>
                </select>
              </label>
              <label>
                Комнаты
                <select id="filter-rooms" name="rooms">
                  <option value="">Любое количество</option>
                  <option value="studio">Студия</option>
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4+">4+</option>
                </select>
              </label>
              <label>
                Класс
                <select id="filter-class" name="classType">
                  <option value="">Любой класс</option>
                  <option value="comfort">Комфорт</option>
                  <option value="business">Бизнес</option>
                  <option value="premium">Премиум</option>
                </select>
              </label>
              <label>
                Сортировка
                <select id="filter-sort" name="sort">
                  <option value="priority">Сначала рекомендуемые</option>
                  <option value="price-asc">Цена: по возрастанию</option>
                  <option value="price-desc">Цена: по убыванию</option>
                </select>
              </label>
            </div>
            <div class="catalog-filters-actions">
              <button class="btn btn-small" type="submit">Применить</button>
              <button class="btn btn-small btn-outline" type="button" id="catalog-reset">Сбросить</button>
            </div>
          </form>

          <p class="catalog-summary" id="catalog-summary"></p>
          <div class="cards-grid" id="catalog-results"></div>
          <p class="catalog-more-wrap">
            <button class="btn btn-outline" type="button" id="catalog-show-more">Показать ещё</button>
          </p>
        </div>
      </section>
