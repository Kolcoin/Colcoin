<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Змейка — мини-игра | Городской Ритуал</title>
<meta name="description" content="Классическая игра «Змейка» в браузере. Управление: стрелки или свайпы. Пробел — пауза, R — рестарт.">
<meta name="robots" content="noindex,follow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  body{background:radial-gradient(circle at 50% 0%,#23234a 0%,#0f0f1f 70%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:16px;overflow:hidden}
  h1{margin:0 0 14px;font-size:22px;font-weight:600;letter-spacing:.5px;opacity:.95}
  .wrap{width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center}
  .board{position:relative;width:100%;aspect-ratio:1/1}
  canvas{display:block;width:100%;height:100%;background:#1b1b2e;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.04)}
  .stats{display:flex;justify-content:space-between;align-items:center;width:100%;margin:14px 0 10px;font-size:15px;color:#d5d5ec}
  .stats b{color:#fff}
  .badge{background:#2a2a4a;padding:6px 12px;border-radius:30px}
  .controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
  button{background:linear-gradient(180deg,#4a4a78,#33335c);color:#fff;border:0;padding:11px 22px;border-radius:30px;font-size:15px;cursor:pointer;font-weight:500;box-shadow:0 4px 14px rgba(0,0,0,.3);transition:transform .12s}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(1px)}
  .hint{margin-top:14px;font-size:12px;color:#8a8ab0;text-align:center;line-height:1.5}
  .pad{display:none;margin-top:18px}
  .pad-row{display:flex;justify-content:center;gap:8px}
  .pad button{width:64px;height:64px;padding:0;font-size:22px;border-radius:16px;background:#2a2a4a}
  @media (max-width:600px){
    h1{font-size:18px}
    .pad{display:block}
    .hint .desktop-only{display:none}
  }
  a.home{position:absolute;top:14px;left:14px;color:#9a9ac8;text-decoration:none;font-size:13px;background:rgba(255,255,255,.06);padding:6px 12px;border-radius:20px}
  a.home:hover{color:#fff}
</style>
</head>
<body>
<a class="home" href="/">← на главную</a>
<div class="wrap">
  <h1>Змейка</h1>
  <div class="stats">
    <span class="badge">Счёт: <b id="score">0</b></span>
    <span class="badge">Рекорд: <b id="highScore">0</b></span>
  </div>
  <div class="board"><canvas id="gameCanvas" width="600" height="600"></canvas></div>
  <div class="controls">
    <button id="pauseBtn">Пауза</button>
    <button id="restartBtn">Новая игра</button>
  </div>
  <div class="pad">
    <div class="pad-row"><button data-dir="up">▲</button></div>
    <div class="pad-row">
      <button data-dir="left">◀</button>
      <button data-dir="down">▼</button>
      <button data-dir="right">▶</button>
    </div>
  </div>
  <div class="hint">
    <span class="desktop-only">Стрелки — управление · Пробел — пауза · R — рестарт<br></span>
    Свайпы на телефоне или кнопки ниже
  </div>
</div>

<script>
(function(){
  const c = document.getElementById('gameCanvas');
  const ctx = c.getContext('2d');
  const GRID = 20;
  const CELL = c.width / GRID;
  let snake, dir, next, food, score, high, over, paused, tickId;

  high = parseInt(localStorage.getItem('snake_high') || '0', 10);
  document.getElementById('highScore').textContent = high;

  function reset(){
    clearInterval(tickId);
    snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir = {x:1,y:0};
    next = {x:1,y:0};
    score = 0;
    over = false;
    paused = false;
    document.getElementById('score').textContent = '0';
    document.getElementById('pauseBtn').textContent = 'Пауза';
    placeFood();
    tickId = setInterval(loop, 110);
    draw();
  }

  function placeFood(){
    const free = [];
    for (let i=0;i<GRID;i++) for (let j=0;j<GRID;j++){
      if (!snake.some(p => p.x===i && p.y===j)) free.push({x:i,y:j});
    }
    if (free.length === 0){ over = true; return; }
    food = free[Math.floor(Math.random()*free.length)];
  }

  function loop(){ update(); draw(); }

  function update(){
    if (over || paused) return;
    dir = {...next};
    const h = snake[0];
    const nh = {x:h.x+dir.x, y:h.y+dir.y};
    if (nh.x<0 || nh.x>=GRID || nh.y<0 || nh.y>=GRID || snake.some(p => p.x===nh.x && p.y===nh.y)){
      over = true;
      if (score > high){ high = score; localStorage.setItem('snake_high', high); document.getElementById('highScore').textContent = high; }
      return;
    }
    snake.unshift(nh);
    if (nh.x===food.x && nh.y===food.y){
      score++;
      document.getElementById('score').textContent = score;
      placeFood();
    } else {
      snake.pop();
    }
  }

  function draw(){
    ctx.fillStyle = '#1b1b2e';
    ctx.fillRect(0,0,c.width,c.height);
    // grid (subtle)
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    for (let i=1;i<GRID;i++){
      ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,c.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,i*CELL); ctx.lineTo(c.width,i*CELL); ctx.stroke();
    }
    // food
    ctx.fillStyle = '#ff5c7a';
    ctx.beginPath();
    ctx.arc(food.x*CELL+CELL/2, food.y*CELL+CELL/2, CELL/2-3, 0, Math.PI*2);
    ctx.fill();
    // snake
    for (let i=0;i<snake.length;i++){
      const p = snake[i];
      const t = i / snake.length;
      ctx.fillStyle = i===0 ? '#d8ffe6' : `rgb(${Math.round(0 + t*40)}, ${Math.round(230 - t*60)}, ${Math.round(150 - t*40)})`;
      const r = 6;
      const x = p.x*CELL+2, y = p.y*CELL+2, w = CELL-4, h2 = CELL-4;
      ctx.beginPath();
      ctx.moveTo(x+r,y);
      ctx.arcTo(x+w,y,x+w,y+h2,r);
      ctx.arcTo(x+w,y+h2,x,y+h2,r);
      ctx.arcTo(x,y+h2,x,y,r);
      ctx.arcTo(x,y,x+w,y,r);
      ctx.fill();
    }
    if (over){
      ctx.fillStyle = 'rgba(0,0,0,0.75)';
      ctx.fillRect(0,0,c.width,c.height);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 38px Arial';
      ctx.fillText('Игра окончена', c.width/2, c.height/2 - 30);
      ctx.font = '22px Arial';
      ctx.fillStyle = '#ffb088';
      ctx.fillText('Счёт: ' + score, c.width/2, c.height/2 + 10);
      ctx.font = '16px Arial';
      ctx.fillStyle = '#b8b8d8';
      ctx.fillText('Нажмите «Новая игра» или R', c.width/2, c.height/2 + 44);
    } else if (paused){
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0,0,c.width,c.height);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 44px Arial';
      ctx.fillText('Пауза', c.width/2, c.height/2);
    }
  }

  function turn(d){
    if (d==='up'    && dir.y!== 1) next = {x:0,y:-1};
    if (d==='down'  && dir.y!==-1) next = {x:0,y: 1};
    if (d==='left'  && dir.x!== 1) next = {x:-1,y:0};
    if (d==='right' && dir.x!==-1) next = {x: 1,y:0};
  }

  document.addEventListener('keydown', (e) => {
    const k = e.key;
    if (k==='ArrowUp')    { turn('up');    e.preventDefault(); }
    else if (k==='ArrowDown')  { turn('down');  e.preventDefault(); }
    else if (k==='ArrowLeft')  { turn('left');  e.preventDefault(); }
    else if (k==='ArrowRight') { turn('right'); e.preventDefault(); }
    else if (k===' ')          { if (!over) { paused = !paused; document.getElementById('pauseBtn').textContent = paused ? 'Продолжить' : 'Пауза'; } e.preventDefault(); }
    else if (k==='r' || k==='R'){ reset(); }
  });

  document.querySelectorAll('.pad button').forEach(btn => {
    btn.addEventListener('click', () => turn(btn.dataset.dir));
  });

  document.getElementById('restartBtn').addEventListener('click', reset);
  document.getElementById('pauseBtn').addEventListener('click', () => {
    if (over) return reset();
    paused = !paused;
    document.getElementById('pauseBtn').textContent = paused ? 'Продолжить' : 'Пауза';
  });

  // swipe
  let tx=0, ty=0;
  c.addEventListener('touchstart', (e) => { const t=e.touches[0]; tx=t.clientX; ty=t.clientY; }, {passive:true});
  c.addEventListener('touchend', (e) => {
    const t=e.changedTouches[0];
    const dx=t.clientX-tx, dy=t.clientY-ty;
    if (Math.abs(dx) > Math.abs(dy)) turn(dx>0?'right':'left');
    else turn(dy>0?'down':'up');
  });

  reset();
})();
</script>
</body>
</html>
